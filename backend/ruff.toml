line-length = 110
target-version = "py313"

[lint]
# E/F: errores base, I: imports ordenados, B: bugs comunes, UP: sintaxis moderna, S: seguridad (bandit)
select = ["E", "F", "I", "B", "UP", "S"]

[lint.per-file-ignores]
"tests/**" = ["S101", "S105"]  # pytest usa assert; las contraseñas de test son ficticias
"migrations/**" = ["S608"]  # el SQL se arma con constantes del repo, nunca con entrada de usuario
