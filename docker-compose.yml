# Entorno local completo: docker compose up --build
# Las variables salen de .env (plantilla en .env.example).

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Solo en localhost: la base no queda expuesta a la red
      - "127.0.0.1:${POSTGRES_PORT:?falta POSTGRES_PORT en .env}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Corre una vez y termina: crea los roles (superusuario) y aplica las
  # migraciones (ceragen_owner). Las contraseñas van en la URL: deben ser
  # seguras para URL (las de openssl rand -hex lo son).
  migrate:
    build: ./backend
    command: sh -c "python -m app.db.bootstrap && alembic upgrade head && python -m app.db.seed"
    environment:
      DATABASE_ADMIN_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_OWNER_URL: postgresql://ceragen_owner:${DB_OWNER_PASSWORD:?falta DB_OWNER_PASSWORD en .env}@db:5432/${POSTGRES_DB}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?falta DB_APP_PASSWORD en .env}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:?falta SEED_ADMIN_USERNAME en .env}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?falta SEED_ADMIN_EMAIL en .env}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?falta SEED_ADMIN_PASSWORD en .env}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    environment:
      # Mínimo privilegio: la API nunca usa el superusuario ni el dueño del esquema.
      DATABASE_URL: postgresql://ceragen_app:${DB_APP_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGINS: ${CORS_ORIGINS:?falta CORS_ORIGINS en .env}
    ports:
      - "127.0.0.1:${API_PORT:?falta API_PORT en .env}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:?falta VITE_API_URL en .env}
    environment:
      PORT: 8080
    ports:
      - "127.0.0.1:${WEB_PORT:?falta WEB_PORT en .env}:8080"

  # Solo bajo demanda: docker compose run --rm test
  test:
    profiles: [test]
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    command: pytest -q -p no:cacheprovider
    environment:
      DATABASE_ADMIN_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./backend/tests:/app/tests:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
